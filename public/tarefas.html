<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas | Clínica IHC</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">Clínica IHC</div>
      <div class="links">
        <a href="/pacientes.html">Pacientes</a>
        <a href="/agenda.html">Agenda</a>
        <a class="active" href="/tarefas.html">Tarefas</a>
        <span id="usuarioLogado"></span>
        <button class="btn-secondary" onclick="sair()">Sair</button>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="card">
      <h1>Tarefas da Clínica</h1>
      <p>Crie tarefas simples para acompanhar atividades administrativas.</p>

      <form id="formTarefa" class="form-grid two">
        <div>
          <label for="titulo">Título</label>
          <input type="text" id="titulo" placeholder="Ex: Confirmar consultas" required>
        </div>
        <div>
          <label for="descricao">Descrição</label>
          <textarea id="descricao" placeholder="Descreva a tarefa"></textarea>
        </div>
        <div class="actions">
          <button type="submit">Cadastrar Tarefa</button>
        </div>
      </form>

      <div id="mensagem" class="msg"></div>
      <div id="listaTarefas" class="task-list"></div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/tarefas.js"></script>
</body>
</html>
