<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Clínica IHC</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <main class="card login-card">
    <h1>Clínica Psicológica</h1>
    <p>Acesse o sistema com seu e-mail e senha.</p>

    <form id="formLogin" class="form-grid one">
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="usuario@email.com" autocomplete="email" required>
      </div>

      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Sua senha" autocomplete="current-password" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <div id="mensagem" class="msg"></div>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
