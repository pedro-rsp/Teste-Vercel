<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda | Clínica IHC</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <div class="logo">Clínica IHC</div>
      <div class="links">
        <a href="/pacientes.html">Pacientes</a>
        <a class="active" href="/agenda.html">Agenda</a>
        <a href="/tarefas.html">Tarefas</a>
        <span id="usuarioLogado"></span>
        <button class="btn-secondary" onclick="sair()">Sair</button>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="card">
      <h1>Agenda e Agendamentos</h1>
      <p>Cadastre sessões vinculadas aos pacientes.</p>

      <form id="formAgenda" class="form-grid">
        <div>
          <label for="paciente_id">Paciente</label>
          <select id="paciente_id" required>
            <option value="">Selecione um paciente</option>
          </select>
        </div>
        <div>
          <label for="data">Data</label>
          <input type="date" id="data" required>
        </div>
        <div>
          <label for="hora">Hora</label>
          <input type="time" id="hora" required>
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status" required>
            <option value="Confirmada">Confirmada</option>
            <option value="Pendente">Pendente</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
        <div class="actions">
          <button type="submit">Cadastrar Agendamento</button>
        </div>
      </form>

      <div id="mensagem" class="msg"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Data</th>
              <th>Hora</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="tabelaAgenda"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/agenda.js"></script>
</body>
</html>
